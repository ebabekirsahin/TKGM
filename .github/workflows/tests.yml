name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest requests pandas shapely pyproj
      - name: Run unit tests
        run: python -m pytest -q
      - name: Compile application modules
        run: python -m compileall -q app.py core sources map_view reports tests
